name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npx expo export -p web

      - name: Fix paths for GitHub Pages subpath
        run: |
          # Replace root-relative paths with relative paths so it loads correctly on https://<user>.github.io/<repo>/
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html
          # Add .nojekyll so GitHub Pages does not ignore folders starting with underscore (_expo)
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
