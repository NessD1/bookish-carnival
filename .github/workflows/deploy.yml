name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npx expo export -p web

      - name: Fix paths and fonts for Edge and Chromium
        run: |
          # 1. Replace root-relative paths in index.html with relative paths
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html

          # 2. Inject explicit @font-face rules with both "ionicons" and "Ionicons" with local/relative fallback for Edge and Chromium
          sed -i 's|</head>|<style id="expo-generated-fonts">@font-face{font-family:"ionicons";src:url("./assets/node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/Ionicons.b4eb097d35f44ed943676fd56f6bdc51.ttf") format("truetype");font-display:swap;}@font-face{font-family:"Ionicons";src:url("./assets/node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/Ionicons.b4eb097d35f44ed943676fd56f6bdc51.ttf") format("truetype");font-display:swap;}</style></head>|g' dist/index.html

          # 3. Fix /assets/ absolute font paths inside all exported js bundles
          find dist/_expo/static/js/web/ -name "*.js" -exec sed -i 's|"/assets/node_modules|"\./assets/node_modules|g' {} +

          # 4. Add .nojekyll so GitHub Pages serves directories with underscores (_expo)
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
