name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npx expo export -p web

      - name: Fix base path for GitHub Pages
        run: |
          # Ensure relative paths for assets on GitHub Pages project sites
          sed -i 's|href="/favicon.ico"|href="./favicon.ico"|g' dist/index.html
          sed -i 's|src="/_expo/|src="./_expo/|g' dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
