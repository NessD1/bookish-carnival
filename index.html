<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Void Drifter - Retro Asteroids Game</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #0f0f1b;
    color: #eee;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 95vh;
  }
  h1 {
    margin-bottom: 4px;
    color: #00e5ff;
    text-shadow: 0 0 10px #00e5ff;
    letter-spacing: 2px;
  }
  p.subtitle {
    margin-top: 0;
    color: #8892b0;
    font-size: 14px;
  }
  #canvas-container {
    position: relative;
    border: 4px solid #1f2335;
    box-shadow: 0 0 25px rgba(0, 229, 255, 0.2);
    border-radius: 4px;
    overflow: hidden;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }
  .controls-card {
    margin-top: 16px;
    background: #161829;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 13px;
    color: #a9b1d6;
    display: flex;
    gap: 24px;
    border: 1px solid #232742;
  }
  .key {
    background: #232742;
    color: #00e5ff;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: bold;
  }
</style>
<!-- fengari-web executes Lua directly in browser -->
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
</head>
<body>

<h1>VOID DRIFTER</h1>
<p class="subtitle">TIC-80 / Fantasy Console Style Asteroids in Lua (Powered by Fengari)</p>

<div id="canvas-container">
  <canvas id="screen" width="720" height="408"></canvas>
</div>

<div class="controls-card">
  <div><span class="key">&uarr;</span> / <span class="key">W</span> Thrust</div>
  <div><span class="key">&larr;</span> <span class="key">&rarr;</span> / <span class="key">A</span> <span class="key">D</span> Rotate</div>
  <div><span class="key">Z</span> / <span class="key">J</span> / <span class="key">Space</span> Shoot</div>
  <div><span class="key">X</span> / <span class="key">K</span> Hyper-Warp</div>
</div>

<script type="text/javascript">
  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const V_WIDTH = 240;
  const V_HEIGHT = 136;
  const SCALE = 3;

  // TIC-80 standard 16-color palette
  const PALETTE = [
    "#140c1c", "#442434", "#30346d", "#4e4a4e",
    "#854c30", "#346524", "#d04648", "#757161",
    "#597dce", "#d27d2c", "#8595a1", "#6daa2c",
    "#d2aa99", "#6dc2ca", "#dad45e", "#deeed6"
  ];

  const keys = {};
  const prevKeys = {};

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
  });
  window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
  });

  function isBtnDown(id) {
    if (id === 0) return keys["ArrowUp"] || keys["KeyW"];
    if (id === 1) return keys["ArrowDown"] || keys["KeyS"];
    if (id === 2) return keys["ArrowLeft"] || keys["KeyA"];
    if (id === 3) return keys["ArrowRight"] || keys["KeyD"];
    if (id === 4) return keys["KeyZ"] || keys["KeyJ"] || keys["Space"];
    if (id === 5) return keys["KeyX"] || keys["KeyK"];
    return false;
  }

  function isBtnPressed(id) {
    const curr = isBtnDown(id);
    const prev = prevKeys[id] || false;
    return curr && !prev;
  }

  // Fantasy console bridge functions for Lua
  window.tic_cls = function(colorIdx) {
    ctx.fillStyle = PALETTE[colorIdx % 16] || "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  };

  window.tic_pix = function(x, y, colorIdx) {
    ctx.fillStyle = PALETTE[colorIdx % 16] || "#fff";
    ctx.fillRect(Math.floor(x) * SCALE, Math.floor(y) * SCALE, SCALE, SCALE);
  };

  window.tic_line = function(x0, y0, x1, y1, colorIdx) {
    ctx.strokeStyle = PALETTE[colorIdx % 16] || "#fff";
    ctx.lineWidth = SCALE;
    ctx.beginPath();
    ctx.moveTo(x0 * SCALE, y0 * SCALE);
    ctx.lineTo(x1 * SCALE, y1 * SCALE);
    ctx.stroke();
  };

  window.tic_circ = function(x, y, r, colorIdx) {
    ctx.fillStyle = PALETTE[colorIdx % 16] || "#fff";
    ctx.beginPath();
    ctx.arc(x * SCALE, y * SCALE, Math.max(1, r * SCALE), 0, Math.PI * 2);
    ctx.fill();
  };

  window.tic_circb = function(x, y, r, colorIdx) {
    ctx.strokeStyle = PALETTE[colorIdx % 16] || "#fff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x * SCALE, y * SCALE, Math.max(1, r * SCALE), 0, Math.PI * 2);
    ctx.stroke();
  };

  window.tic_print = function(text, x, y, colorIdx, fixed, scale) {
    scale = scale || 1;
    ctx.fillStyle = PALETTE[colorIdx % 16] || "#fff";
    ctx.font = `${Math.floor(8 * SCALE * (scale * 0.7))}px monospace`;
    ctx.fillText(String(text), x * SCALE, (y + 6 * scale) * SCALE);
  };

  window.tic_btn = isBtnDown;
  window.tic_btnp = isBtnPressed;
  window.tic_time = function() { return performance.now(); };
  window.tic_sfx = function() {}; // mock audio for browser simplicity

  window.updatePrevKeys = function() {
    for (let i = 0; i <= 7; i++) {
      prevKeys[i] = isBtnDown(i);
    }
  };
</script>

<script type="application/lua">
local js = require "js"
local window = js.global

-- Bind Javascript host APIs to TIC-80 names
function cls(c) window:tic_cls(c) end
function pix(x, y, c) window:tic_pix(x, y, c) end
function line(x0, y0, x1, y1, c) window:tic_line(x0, y0, x1, y1, c) end
function circ(x, y, r, c) window:tic_circ(x, y, r, c) end
function circb(x, y, r, c) window:tic_circb(x, y, r, c) end
function print(str, x, y, c, fixed, scale) window:tic_print(str, x, y, c, fixed, scale) end
function btn(id) return window:tic_btn(id) end
function btnp(id) return window:tic_btnp(id) end
function time() return window:tic_time() end
function sfx(...) end

-- GAME STATE & LOGIC
local player = {
    x = 120,
    y = 68,
    vx = 0,
    vy = 0,
    angle = -math.pi / 2,
    thrust = false,
    radius = 5,
    cooldown = 0,
    invuln = 120,
    score = 0,
    lives = 3,
    alive = true,
    warp_cooldown = 0
}

local bullets = {}
local asteroids = {}
local particles = {}
local stars = {}
local wave = 1
local game_state = "title"
local shake_time = 0

for i = 1, 60 do
    table.insert(stars, {
        x = math.random(0, 239),
        y = math.random(0, 135),
        speed = math.random(1, 3) * 0.15,
        color = math.random() > 0.4 and 15 or 14
    })
end

local function spawn_particle(x, y, vx, vy, color, life)
    table.insert(particles, {
        x = x, y = y, vx = vx, vy = vy,
        color = color, life = life, max_life = life
    })
end

local function spawn_explosion(x, y, count, color)
    for i = 1, count do
        local spd = math.random() * 2 + 0.5
        local ang = math.random() * math.pi * 2
        spawn_particle(
            x, y,
            math.cos(ang) * spd, math.sin(ang) * spd,
            color or (math.random() > 0.5 and 9 or 4),
            math.random(15, 30)
        )
    end
end

local function spawn_asteroid(x, y, size)
    local ang = math.random() * math.pi * 2
    local spd = (4 - size) * 0.4 + math.random() * 0.3
    local verts = {}
    local num_verts = 8
    local base_radius = size * 5 + 3

    for i = 1, num_verts do
        local a = (i / num_verts) * math.pi * 2
        local r = base_radius + math.random(-2, 2)
        table.insert(verts, { x = math.cos(a) * r, y = math.sin(a) * r })
    end

    table.insert(asteroids, {
        x = x, y = y,
        vx = math.cos(ang) * spd, vy = math.sin(ang) * spd,
        rot = 0, rot_speed = (math.random() - 0.5) * 0.05,
        size = size, radius = base_radius, verts = verts
    })
end

local function spawn_wave(num)
    for i = 1, 3 + num do
        local edge = math.random(1, 4)
        local ax, ay = 0, 0
        if edge == 1 then ax = math.random(0, 240); ay = -10
        elseif edge == 2 then ax = 250; ay = math.random(0, 136)
        elseif edge == 3 then ax = math.random(0, 240); ay = 146
        else ax = -10; ay = math.random(0, 136) end
        spawn_asteroid(ax, ay, 3)
    end
end

local function reset_game()
    player.x = 120
    player.y = 68
    player.vx = 0
    player.vy = 0
    player.angle = -math.pi / 2
    player.lives = 3
    player.score = 0
    player.invuln = 120
    player.alive = true
    wave = 1
    bullets = {}
    asteroids = {}
    particles = {}
    spawn_wave(wave)
end

function TIC()
    local ox, oy = 0, 0
    if shake_time > 0 then
        ox = math.random(-2, 2)
        oy = math.random(-2, 2)
        shake_time = shake_time - 1
    end

    for _, s in ipairs(stars) do
        s.x = s.x - s.speed
        if s.x < 0 then
            s.x = 240
            s.y = math.random(0, 135)
        end
    end

    if game_state == "title" then
        if btnp(4) or btnp(0) then
            reset_game()
            game_state = "play"
        end
    elseif game_state == "gameover" then
        if btnp(4) then
            game_state = "title"
        end
    elseif game_state == "play" then
        if btn(2) then player.angle = player.angle - 0.08 end
        if btn(3) then player.angle = player.angle + 0.08 end

        player.thrust = btn(0)
        if player.thrust then
            local accel = 0.09
            player.vx = player.vx + math.cos(player.angle) * accel
            player.vy = player.vy + math.sin(player.angle) * accel

            local back_x = player.x - math.cos(player.angle) * 6
            local back_y = player.y - math.sin(player.angle) * 6
            local spread = (math.random() - 0.5) * 0.5
            spawn_particle(
                back_x, back_y,
                -math.cos(player.angle + spread) * (1.5 + math.random()),
                -math.sin(player.angle + spread) * (1.5 + math.random()),
                math.random() > 0.4 and 4 or 9,
                math.random(6, 14)
            )
        end

        player.vx = player.vx * 0.985
        player.vy = player.vy * 0.985

        player.x = (player.x + player.vx) % 240
        player.y = (player.y + player.vy) % 136

        if player.cooldown > 0 then player.cooldown = player.cooldown - 1 end
        if (btn(4) or btnp(4)) and player.cooldown == 0 and player.alive then
            local b_spd = 3.5
            table.insert(bullets, {
                x = player.x + math.cos(player.angle) * 7,
                y = player.y + math.sin(player.angle) * 7,
                vx = math.cos(player.angle) * b_spd + player.vx * 0.4,
                vy = math.sin(player.angle) * b_spd + player.vy * 0.4,
                life = 45
            })
            player.cooldown = 10
        end

        if player.warp_cooldown > 0 then player.warp_cooldown = player.warp_cooldown - 1 end
        if btnp(5) and player.warp_cooldown == 0 and player.alive then
            spawn_explosion(player.x, player.y, 10, 12)
            player.x = math.random(20, 220)
            player.y = math.random(20, 116)
            player.vx = 0
            player.vy = 0
            player.invuln = 45
            player.warp_cooldown = 180
        end

        if player.invuln > 0 then player.invuln = player.invuln - 1 end

        if #asteroids == 0 then
            wave = wave + 1
            spawn_wave(wave)
            player.score = player.score + 500
        end

        for i = #bullets, 1, -1 do
            local b = bullets[i]
            b.x = (b.x + b.vx) % 240
            b.y = (b.y + b.vy) % 136
            b.life = b.life - 1
            if b.life <= 0 then table.remove(bullets, i) end
        end

        for i = #asteroids, 1, -1 do
            local a = asteroids[i]
            a.x = (a.x + a.vx) % 240
            a.y = (a.y + a.vy) % 136
            a.rot = a.rot + a.rot_speed

            local destroyed = false
            for bi = #bullets, 1, -1 do
                local b = bullets[bi]
                local dist_sq = (a.x - b.x)^2 + (a.y - b.y)^2
                if dist_sq < (a.radius + 2)^2 then
                    table.remove(bullets, bi)
                    destroyed = true
                    break
                end
            end

            if destroyed then
                spawn_explosion(a.x, a.y, a.size * 6, 15)
                player.score = player.score + (4 - a.size) * 100
                shake_time = 4
                if a.size > 1 then
                    spawn_asteroid(a.x, a.y, a.size - 1)
                    spawn_asteroid(a.x, a.y, a.size - 1)
                end
                table.remove(asteroids, i)
            else
                if player.alive and player.invuln <= 0 then
                    local p_dist_sq = (a.x - player.x)^2 + (a.y - player.y)^2
                    if p_dist_sq < (a.radius + player.radius)^2 then
                        spawn_explosion(player.x, player.y, 25, 9)
                        shake_time = 14
                        player.lives = player.lives - 1
                        if player.lives <= 0 then
                            player.alive = false
                            game_state = "gameover"
                        else
                            player.x = 120
                            player.y = 68
                            player.vx = 0
                            player.vy = 0
                            player.invuln = 120
                        end
                    end
                end
            end
        end
    end

    for i = #particles, 1, -1 do
        local p = particles[i]
        p.x = p.x + p.vx
        p.y = p.y + p.vy
        p.life = p.life - 1
        if p.life <= 0 then table.remove(particles, i) end
    end

    cls(0)

    for _, s in ipairs(stars) do
        pix(s.x + ox, s.y + oy, s.color)
    end

    for _, p in ipairs(particles) do
        pix(p.x + ox, p.y + oy, p.color)
    end

    for _, a in ipairs(asteroids) do
        local num_v = #a.verts
        for j = 1, num_v do
            local next_idx = (j % num_v) + 1
            local v1 = a.verts[j]
            local v2 = a.verts[next_idx]
            local cos_r = math.cos(a.rot)
            local sin_r = math.sin(a.rot)

            local x1 = a.x + (v1.x * cos_r - v1.y * sin_r) + ox
            local y1 = a.y + (v1.x * sin_r + v1.y * cos_r) + oy
            local x2 = a.x + (v2.x * cos_r - v2.y * sin_r) + ox
            local y2 = a.y + (v2.x * sin_r + v2.y * cos_r) + oy

            line(x1, y1, x2, y2, 15)
        end
    end

    for _, b in ipairs(bullets) do
        circ(b.x + ox, b.y + oy, 1, 11)
    end

    if (game_state == "play" or game_state == "title") and (player.invuln % 6 < 3) then
        local nose_x = player.x + math.cos(player.angle) * 7 + ox
        local nose_y = player.y + math.sin(player.angle) * 7 + oy

        local left_wing_x = player.x + math.cos(player.angle + 2.5) * 6 + ox
        local left_wing_y = player.y + math.sin(player.angle + 2.5) * 6 + oy

        local right_wing_x = player.x + math.cos(player.angle - 2.5) * 6 + ox
        local right_wing_y = player.y + math.sin(player.angle - 2.5) * 6 + oy

        line(nose_x, nose_y, left_wing_x, left_wing_y, 12)
        line(nose_x, nose_y, right_wing_x, right_wing_y, 12)
        line(left_wing_x, left_wing_y, player.x + ox, player.y + oy, 12)
        line(right_wing_x, right_wing_y, player.x + ox, player.y + oy, 12)

        if player.invuln > 0 then
            circb(player.x + ox, player.y + oy, 8, 8)
        end
    end

    if game_state == "play" then
        print(string.format("SCORE %05d", player.score), 4, 4, 15, false, 1)
        print("WAVE " .. wave, 105, 4, 6, false, 1)

        for l = 1, player.lives do
            local lx = 205 + l * 8
            line(lx, 4, lx - 2, 9, 11)
            line(lx, 4, lx + 2, 9, 11)
            line(lx - 2, 9, lx + 2, 9, 11)
        end

        if player.warp_cooldown == 0 then
            print("WARP [X]", 4, 126, 11, false, 1)
        end
    elseif game_state == "title" then
        print("VOID DRIFTER", 68, 38, 12, true, 2)
        print("RETRO ASTEROIDS SURVIVAL", 42, 60, 15, false, 1)
        print("UP: Thrust   LEFT/RIGHT: Rotate", 40, 80, 9, false, 1)
        print("Z / SPACE: Shoot   X: Warp", 48, 90, 9, false, 1)

        if math.floor(time() / 500) % 2 == 0 then
            print("PRESS Z OR SPACE TO START", 48, 110, 11, false, 1)
        end
    elseif game_state == "gameover" then
        print("GAME OVER", 78, 42, 6, true, 2)
        print(string.format("FINAL SCORE: %d", player.score), 70, 68, 15, false, 1)
        print(string.format("WAVE REACHED: %d", wave), 74, 80, 14, false, 1)
        if math.floor(time() / 500) % 2 == 0 then
            print("PRESS Z TO TRY AGAIN", 58, 105, 11, false, 1)
        end
    end
end

-- Main loop callback
local function loop()
    TIC()
    window:updatePrevKeys()
    window:requestAnimationFrame(loop)
end

window:requestAnimationFrame(loop)
</script>

</body>
</html>
